    <script>
      (function () {
        try {
          const root = document.documentElement
          const rawPreferences = window.localStorage.getItem('citisent.admin.preferences')
          const parsedPreferences = rawPreferences ? JSON.parse(rawPreferences) : null
          const preferences =
            parsedPreferences &&
            typeof parsedPreferences === 'object' &&
            !Array.isArray(parsedPreferences) &&
            typeof parsedPreferences.schemaVersion === 'number' &&
            'payload' in parsedPreferences
              ? parsedPreferences.payload
              : parsedPreferences

          const themePreference = preferences?.theme || 'System'
          const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const effectiveTheme =
            themePreference === 'Dark'
              ? 'dark'
              : themePreference === 'Light'
                ? 'light'
                : systemPrefersDark
                  ? 'dark'
                  : 'light'

          root.dataset.theme = effectiveTheme

          const fontSizeMap = { Small: 14, Medium: 16, Large: 18 }
          root.style.fontSize = `${fontSizeMap[preferences?.fontSize] || 16}px`

          if (preferences?.animationsEnabled === false) {
            root.classList.add('reduced-motion')
          }
        } catch {
          // Keep first paint resilient even if localStorage is malformed.
        }
      })()
    </script>
